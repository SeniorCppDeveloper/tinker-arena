<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinker Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <div class="menu-box">
            <h1>TINKER ARENA</h1>
            <p>Введи ник и жди подключения</p>
            <input type="text" id="nickInput" placeholder="Ник" maxlength="16" value="Tinker">
            <button id="playBtn">Войти</button>
            <div id="status">Ожидание...</div>
        </div>
    </div>

    <div id="game" style="display:none;">
        <div id="ui">
            <div class="player-info">
                <span id="myName">Вы</span>
                <div class="hp-bar"><div id="myHp" class="hp-fill"></div></div>
                <span id="myHpText">100/100</span>
            </div>
            <div class="player-info">
                <span id="enemyName">Противник</span>
                <div class="hp-bar"><div id="enemyHp" class="hp-fill"></div></div>
                <span id="enemyHpText">100/100</span>
            </div>
        </div>
        <canvas id="arena" width="1000" height="650"></canvas>
        <div id="skills">
            <div class="skill" data-skill="q"><span class="key">Q</span> Лазер <span class="cd" id="cdq">✓</span></div>
            <div class="skill" data-skill="w"><span class="key">W</span> Ракеты <span class="cd" id="cdw">✓</span></div>
            <div class="skill" data-skill="e"><span class="key">E</span> Матрица <span class="cd" id="cde">✓</span></div>
            <div class="skill" data-skill="r"><span class="key">R</span> Реарм <span class="cd" id="cdr">✓</span></div>
            <div class="skill" data-skill="z"><span class="key">Z</span> Блинк <span class="cd" id="cdz">✓</span></div>
            <div class="skill" data-skill="x"><span class="key">X</span> Шива <span class="cd" id="cdx">✓</span></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
